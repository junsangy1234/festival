diagnosis:
  risk-policy:
    rules:
      - risk-code: R-VOL-001
        title: "{placeName} 급상승 예상"
        description: "{placeName} 집중률 상승폭이 +{value}%p로 예상됩니다."
        severity: CRITICAL
        priority: 1
        metric-key: VOLATILITY_PEAK_INCREASE
        operator: GREATER_THAN_OR_EQUAL
        threshold: 25
        evidence-fields: [placeName, date]
        recommendation-codes: [O-INF-001]
        enabled: true
      - risk-code: R-COMP-001
        title: "동기간 인근 축제 존재"
        description: "동기간 50km 이내 인근 축제가 {value}건 확인되었습니다."
        severity: WARNING
        priority: 2
        metric-key: COMPETING_FESTIVAL_COUNT_50KM
        operator: GREATER_THAN_OR_EQUAL
        threshold: 1
        evidence-fields: [festivalNames]
        recommendation-codes: [O-PRO-003]
        enabled: true
      # 기획서 5.5.1 · 축제장 좌표가 정확할 때만 판정한다(시군구 중심 근사면 지표 자체가 없다).
      - risk-code: R-VOL-005
        title: "축제장 최인접 관광지 급상승 예상"
        description: "축제장에서 {distanceKm}km 떨어진 {placeName}의 상승폭이 +{value}%p로 예상됩니다."
        severity: WARNING
        priority: 2
        metric-key: NEAREST_PLACE_PEAK_INCREASE
        operator: GREATER_THAN_OR_EQUAL
        threshold: 20
        evidence-fields: [placeName, date, distanceKm]
        recommendation-codes: [O-INF-003]
        enabled: true
      - risk-code: R-COMP-002
        title: "인접 시군구 동기간 축제 2건 이상"
        description: "동기간 50km 이내 인근 축제가 {value}건입니다."
        severity: WARNING
        priority: 4
        metric-key: COMPETING_FESTIVAL_COUNT_50KM
        operator: GREATER_THAN_OR_EQUAL
        threshold: 2
        evidence-fields: [festivalNames]
        recommendation-codes: [O-PRO-003]
        enabled: true
      # CSV #9 실측 방문객수 기준(부록 A · 방문 10만+)
      - risk-code: R-COMP-003
        title: "인접 대규모 축제 존재"
        description: "동기간 인근에 방문 10만 이상 대규모 축제가 {value}건 있습니다."
        severity: CRITICAL
        priority: 2
        metric-key: COMPETING_LARGE_FESTIVAL_COUNT
        operator: GREATER_THAN_OR_EQUAL
        threshold: 1
        evidence-fields: [festivalNames]
        recommendation-codes: [O-SCH-001]
        enabled: true
      - risk-code: R-YEAR-002
        title: "최초 개최 3년 이내 · 미검증 축제"
        description: "최초 개최연도({firstHeldYear})가 최근 3년 이내입니다."
        severity: WARNING
        priority: 5
        metric-key: FESTIVAL_HISTORY_YEARS_SINCE_FIRST
        operator: LESS_THAN_OR_EQUAL
        threshold: 3
        evidence-fields: [firstHeldYear]
        recommendation-codes: []
        enabled: true
      - risk-code: R-YEAR-003
        title: "역대급 규모 · 안전 관리 강화 권고"
        description: "작년 방문객수가 {value}명으로 역대급 규모입니다."
        severity: WARNING
        priority: 3
        metric-key: FESTIVAL_HISTORY_LAST_YEAR_VISITORS
        operator: GREATER_THAN_OR_EQUAL
        threshold: 1000000
        evidence-fields: [festivalName]
        recommendation-codes: [O-PRG-003]
        enabled: true
      # 기획서 부록 A.2 · 데이터 상태를 리포트에 드러내 "왜 비었는지"를 남긴다.
      - risk-code: R-DATA-001
        title: "일부 데이터 미확보로 표시 축소"
        description: "외부 데이터 {value}종({sourceNames})을 사용할 수 없어 일부 축과 뷰가 비어 있습니다."
        severity: INFO
        priority: 8
        metric-key: UNUSABLE_DATA_SOURCE_COUNT
        operator: GREATER_THAN_OR_EQUAL
        threshold: 1
        evidence-fields: [sourceNames]
        recommendation-codes: []
        enabled: true
      - risk-code: R-DATA-002
        title: "재개최 실적 축제명 매칭 실패"
        description: "문체부 지역축제 실적에서 축제명을 찾지 못해 작년 방문객수·예산을 병기하지 못했습니다."
        severity: INFO
        priority: 9
        metric-key: FESTIVAL_NAME_MATCH_FAILED
        operator: EQUAL
        threshold: 1
        evidence-fields: []
        recommendation-codes: []
        enabled: true
      # 아래 규칙은 기존 정책을 보존한 예시다. 현재 정제 지표가 확정되기 전까지 실행하지 않는다.
      - risk-code: R-VOL-004
        title: "관광지 간 변동성 편차 큼"
        description: "관광지 간 변동성 표준편차가 {value}입니다."
        severity: WARNING
        priority: 3
        metric-key: VOLATILITY_STANDARD_DEVIATION
        operator: GREATER_THAN
        threshold: 15
        evidence-fields: []
        recommendation-codes: [O-INF-002]
        enabled: false
      - risk-code: R-DEM-004
        title: "개최 첫날 수요 저점 예상"
        description: "개최 첫날의 예상 집중률이 개최기간 중 가장 낮습니다."
        severity: WARNING
        priority: 4
        metric-key: OPENING_DAY_IS_LOWEST
        operator: EQUAL
        threshold: 1
        evidence-fields: [date]
        recommendation-codes: [O-PRG-002]
        enabled: false
      - risk-code: R-YEAR-001
        title: "작년 대비 시기적합도 하락"
        description: "작년 대비 시기적합도가 {value}p 변화했습니다."
        severity: WARNING
        priority: 5
        metric-key: YEAR_OVER_YEAR_TIMING_FIT_CHANGE
        operator: LESS_THAN_OR_EQUAL
        threshold: -15
        evidence-fields: [previousScore, currentScore]
        recommendation-codes: []
        enabled: false
      # R-YEAR-002가 "최초 개최 3년 이내" 규칙과 중복되어 코드를 분리했다.
      - risk-code: R-YEAR-004
        title: "작년 대비 연계성 하락"
        description: "작년 대비 연계성이 {value}p 변화했습니다."
        severity: WARNING
        priority: 6
        metric-key: YEAR_OVER_YEAR_CONNECTIVITY_CHANGE
        operator: LESS_THAN_OR_EQUAL
        threshold: -15
        evidence-fields: [previousScore, currentScore]
        recommendation-codes: [O-DIS-002]
        enabled: false
