diagnosis:
  risk-policy:
    rules:
      - risk-code: R-VOL-001
        title: "{placeName} 급상승 예상"
        description: "{placeName} 집중률 상승폭이 +{value}%p로 예상됩니다."
        severity: CRITICAL
        priority: 1
        metric-key: VOLATILITY_PEAK_INCREASE
        operator: GREATER_THAN_OR_EQUAL
        threshold: 25
        evidence-fields: [placeName, date]
        recommendation-codes: [O-INF-001]
        enabled: true
      - risk-code: R-COMP-001
        title: "50km 이내 경합 축제 존재"
        description: "동기간 50km 이내 경합 축제가 {value}건 확인되었습니다."
        severity: WARNING
        priority: 2
        metric-key: COMPETING_FESTIVAL_COUNT_50KM
        operator: GREATER_THAN_OR_EQUAL
        threshold: 1
        evidence-fields: [festivalNames]
        recommendation-codes: [O-PRO-003]
        enabled: true
      # 아래 규칙은 기존 정책을 보존한 예시다. 현재 정제 지표가 확정되기 전까지 실행하지 않는다.
      - risk-code: R-VOL-004
        title: "관광지 간 변동성 편차 큼"
        description: "관광지 간 변동성 표준편차가 {value}입니다."
        severity: WARNING
        priority: 3
        metric-key: VOLATILITY_STANDARD_DEVIATION
        operator: GREATER_THAN
        threshold: 15
        evidence-fields: []
        recommendation-codes: [O-INF-002]
        enabled: false
      - risk-code: R-DEM-004
        title: "개최 첫날 수요 저점 예상"
        description: "개최 첫날의 예상 집중률이 개최기간 중 가장 낮습니다."
        severity: WARNING
        priority: 4
        metric-key: OPENING_DAY_IS_LOWEST
        operator: EQUAL
        threshold: 1
        evidence-fields: [date]
        recommendation-codes: [O-PRG-002]
        enabled: false
      - risk-code: R-YEAR-001
        title: "작년 대비 시기적합도 하락"
        description: "작년 대비 시기적합도가 {value}p 변화했습니다."
        severity: WARNING
        priority: 5
        metric-key: YEAR_OVER_YEAR_TIMING_FIT_CHANGE
        operator: LESS_THAN_OR_EQUAL
        threshold: -15
        evidence-fields: [previousScore, currentScore]
        recommendation-codes: []
        enabled: false
      - risk-code: R-YEAR-002
        title: "작년 대비 연계성 하락"
        description: "작년 대비 연계성이 {value}p 변화했습니다."
        severity: WARNING
        priority: 6
        metric-key: YEAR_OVER_YEAR_CONNECTIVITY_CHANGE
        operator: LESS_THAN_OR_EQUAL
        threshold: -15
        evidence-fields: [previousScore, currentScore]
        recommendation-codes: [O-DIS-002]
        enabled: false
