services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TOUR_API_KEY: ${TOUR_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-festival}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-festival}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-festival}
      FESTIVAL_CACHE_ROOT: /app/cache
    volumes:
      - festival-api-cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      JAVA_BACKEND_BASE_URL: http://app:8080
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-festival}
      POSTGRES_USER: ${POSTGRES_USER:-festival}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-festival}
    volumes:
      - festival-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  festival-postgres-data:
  festival-api-cache:
